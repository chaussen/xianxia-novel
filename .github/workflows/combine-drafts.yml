name: 合并章节预览

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 拼接所有章节
        run: |
          mkdir -p preview

          updated="$(date -u '+%Y-%m-%d %H:%M UTC')"

          {
            echo "# 《理法修途》合并预览"
            echo ""
            echo "> 最后更新：${updated}"
            echo ""
          } > preview/combined.md

          # 序章
          if [ -f "published/prologue.md" ]; then
            echo "" >> preview/combined.md
            echo "---" >> preview/combined.md
            echo "" >> preview/combined.md
            cat published/prologue.md >> preview/combined.md
          fi

          # 按章节编号升序合并：published/ 优先，其次 chapters/
          for n in $(seq -w 1 99); do
            pub="published/chapter-${n}.md"
            chap="chapters/chapter-${n}.md"
            if [ -f "$pub" ]; then
              echo "" >> preview/combined.md
              echo "---" >> preview/combined.md
              echo "" >> preview/combined.md
              cat "$pub" >> preview/combined.md
            elif [ -f "$chap" ]; then
              echo "" >> preview/combined.md
              echo "---" >> preview/combined.md
              echo "" >> preview/combined.md
              cat "$chap" >> preview/combined.md
            fi
          done

      - name: 提交合并文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/combined.md
          if git diff --staged --quiet; then
            echo "combined.md 无变化，跳过提交。"
          else
            git commit -m "auto: 更新章节合并预览 [skip ci]"
            git push
          fi
